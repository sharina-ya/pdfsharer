<!DOCTYPE html>
<html>
<head>
    <title>{{ board.title }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #pdf-container {
            width: 100%;
            height: calc(100vh - 60px);
            overflow-y: auto;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .pdf-page {
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            background: white;
        }
        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .page-container {
            position: relative;
            margin: 0 auto;
        }
        .toolbar {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="clear-btn">Очистить</button>
        <input type="color" id="color-picker" value="#000000">
        <input type="range" id="brush-size" min="1" max="20" value="3">
        <button id="save-btn">Сохранить</button>
    </div>

    <div id="pdf-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script>
        // Инициализация
        const container = document.getElementById('pdf-container');
        let pdfDoc = null;
        let currentPage = 1;
        const boardId = '{{ board.id }}';
        let canvases = [];
        let ctxs = [];
        let isDrawing = false;
        let currentColor = '#000000';
        let brushSize = 3;

        // Загрузка PDF
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';

        pdfjsLib.getDocument("{{ board.pdf_file.url }}").promise.then(function(pdf) {
            pdfDoc = pdf;
            renderAllPages();
            loadSavedDrawings();
        });

        // Отрисовка всех страниц
        function renderAllPages() {
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                renderPage(i);
            }
        }

        // Отрисовка одной страницы
        function renderPage(pageNum) {
            pdfDoc.getPage(pageNum).then(function(page) {
                const viewport = page.getViewport({ scale: 1.5 });

                // Создаем контейнер для страницы
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page-container';
                container.appendChild(pageDiv);

                // Canvas для PDF
                const pdfCanvas = document.createElement('canvas');
                pdfCanvas.className = 'pdf-page';
                pageDiv.appendChild(pdfCanvas);

                // Canvas для рисования
                const drawingCanvas = document.createElement('canvas');
                drawingCanvas.id = `drawing-canvas-${pageNum}`;
                drawingCanvas.className = 'drawing-canvas';
                drawingCanvas.width = viewport.width;
                drawingCanvas.height = viewport.height;
                drawingCanvas.style.width = `${viewport.width}px`;
                drawingCanvas.style.height = `${viewport.height}px`;
                pageDiv.appendChild(drawingCanvas);

                canvases.push(drawingCanvas);
                ctxs.push(drawingCanvas.getContext('2d'));

                // Рендеринг PDF
                page.render({
                    canvasContext: pdfCanvas.getContext('2d'),
                    viewport: viewport
                });

                // Обработчики событий
                setupDrawingEvents(drawingCanvas, drawingCanvas.getContext('2d'));
            });
        }

        // Настройка обработчиков рисования
        function setupDrawingEvents(canvas, ctx) {
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            function startDrawing(e) {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(e.offsetX, e.offsetY);
            }

            function draw(e) {
                if (!isDrawing) return;

                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.offsetX, e.offsetY);
            }

            function stopDrawing() {
                isDrawing = false;
                ctx.beginPath();
            }
        }

        // Загрузка сохраненных рисунков
        function loadSavedDrawings() {
            {% if board.drawing_data %}
                const img = new Image();
                img.onload = function() {
                    ctxs.forEach(ctx => {
                        ctx.drawImage(img, 0, 0);
                    });
                };
                img.src = '{{ board.drawing_data|safe }}';
            {% endif %}
        }

        // Очистка
        document.getElementById('clear-btn').addEventListener('click', function() {
            ctxs.forEach(ctx => {
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            });
        });

        // Изменение параметров
        document.getElementById('color-picker').addEventListener('input', function(e) {
            currentColor = e.target.value;
        });

        document.getElementById('brush-size').addEventListener('input', function(e) {
            brushSize = e.target.value;
        });

        // Сохранение
        document.getElementById('save-btn').addEventListener('click', function() {
            // Создаем объединенное изображение всех страниц
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');

            // Рассчитываем общие размеры
            let totalHeight = 0;
            let maxWidth = 0;

            canvases.forEach(canvas => {
                totalHeight += canvas.height;
                maxWidth = Math.max(maxWidth, canvas.width);
            });

            tempCanvas.width = maxWidth;
            tempCanvas.height = totalHeight;

            // Рисуем все страницы
            let currentY = 0;
            canvases.forEach((canvas, index) => {
                tempCtx.drawImage(canvas, 0, currentY);
                currentY += canvas.height;
            });

            // Сохраняем на сервер
            saveDrawing(tempCanvas.toDataURL('image/png'));
        });

        function saveDrawing(imageData) {
            fetch(`/board/${boardId}/save_drawing/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    drawing_data: imageData
                })
            });
        }
    </script>
</body>
</html>
